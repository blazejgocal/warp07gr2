name: Build .NET project       # klucz i wartość

on:                            # obiekt zagnieżdżony
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:                     # lista
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show directory
        run: pwd

        name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

        name: Restore dependencies
        shell: bash
        run: dotnet restore "Warp07.Demo"